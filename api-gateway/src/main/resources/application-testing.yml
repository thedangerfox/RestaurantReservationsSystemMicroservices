server:
  port: 0

spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: customers-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/customers/**

            - id: menu_items-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/menu-items/**

            - id: table-service
              uri: http://localhost:8083
              predicates:
                - Path=/api/tables/**

            - id: reservation-service
              uri: http://localhost:8084
              predicates:
                - Path=/api/reservations/**

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
