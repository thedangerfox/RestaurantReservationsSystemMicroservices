spring:
    datasource:
        url: jdbc:h2:mem:menu_items-db
        driver-class-name: org.h2.Driver
        username: sa
        password:

    jpa:
        database-platform: org.hibernate.dialect.H2Dialect

    h2:
        console:
            enabled: true
            path: /h2-console
            settings:
                web-allow-others: true
